name: Unpack Afterfree source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source tarball
        shell: bash
        run: |
          cat .af-upload/chunk* | base64 -d > /tmp/afterfree-code.tar.gz
          tar -xzf /tmp/afterfree-code.tar.gz
          rm -rf .af-upload .afterfree-upload
      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import Afterfree v0.1.0 source"
          git push
