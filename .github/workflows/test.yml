name: Native correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev liblz4-1
      - run: python tools/build.py
      - run: python -m pip install -e '.[test]'
      - run: afterfree doctor --json
      - run: pytest -q
      - run: python tools/validate_upstream.py --output upstream.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-validation
          path: upstream.json
